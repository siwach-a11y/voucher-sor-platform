apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: voucher-sor
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: voucher-sor/api:latest
          ports:
            - containerPort: 4000
          envFrom:
            - configMapRef:
                name: voucher-sor-config
            - secretRef:
                name: voucher-sor-secrets
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 4000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 4000
            initialDelaySeconds: 10
            periodSeconds: 20
