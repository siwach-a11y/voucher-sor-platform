apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: voucher-sor-ingress
  namespace: voucher-sor
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /$2
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          # /api/* -> api-service (strips the /api prefix before forwarding, since apps/api's
          # own routes are mounted at /products, /orders, /vendors with no /api prefix).
          - path: /api(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: api-service
                port:
                  number: 4000
          # everything else -> the Next.js frontend
          - path: /()(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: web-service
                port:
                  number: 3000
